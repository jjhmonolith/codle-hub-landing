<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>코들 구면 회전 모션</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;font-family:Arial,sans-serif;color:#192d48;background:white}main{max-width:650px;margin:auto}h1{font-size:22px}p{font-size:14px;color:#667790}.card{position:relative;overflow:hidden;aspect-ratio:1;border-radius:28px;background:#edf4ff;border:1px solid #dfe8f6}h2{position:relative;z-index:2;font-size:34px;line-height:1.45;letter-spacing:-1.5px;margin:34px;pointer-events:none}canvas{position:absolute;width:100%;height:auto;bottom:0;left:0;display:block}.controls{display:flex;gap:12px;margin-top:18px}button{border:0;border-radius:20px;padding:10px 18px;color:#244168;background:#edf4ff;cursor:pointer}</style><main><h1>코들 · 구면 회전 모션</h1><p id="status">원본 불러오는 중</p><div class="card"><h2>수업 준비부터 피드백까지,<br>한 교실에서.</h2><canvas id="codle-yaw" aria-label="코들 구슬 원본의 좌우 회전 모션"></canvas></div><div class="controls"><button id="play">재생</button><button id="reset">처음으로</button><button id="record">8초 영상 저장</button><a id="download" download="codle-surface-motion.webm" hidden>영상 다운로드</a></div></main><script type="module">
import {mountCodleSurface} from './codle-surface-motion.js?v=8';
const controls=Object.fromEntries(['status','play','reset','record','download'].map(id=>[id,document.getElementById(id)]));
await mountCodleSurface(document.querySelector('#codle-yaw'),document.querySelector('.card'),controls);
</script></html>
